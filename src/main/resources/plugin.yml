name: MaterialShop
version: '${version}'
main: dev.materialshop.MaterialShop
api-version: '1.21'
authors: [Ahmed332009]
description: Barter shop - trade materials for materials. No money, no Vault, no economy plugin.
softdepend: [MaterialClaim_Block, MaterialClaim_Chunk, WorldGuard]
commands:
  shop:
    aliases: [materialshopuser, mshop]
    description: Open the MaterialShop menu, create or manage your shops
    usage: /shop [create|list|collect|help]
  shopadmin:
    aliases: [materialshop, ms]
    description: Create and manage admin shops, reload configuration and view the trade log
    usage: /shopadmin [create|remove|edit|reload|log|collect]
permissions:
  materialshop.use:
    default: true
    description: Open /shop and trade with shops
  materialshop.create:
    default: true
    description: Create player shops with /shop create
  materialshop.collect:
    default: true
    description: Collect sale proceeds from the collect box
  materialshop.limit:
    default: true
    description: Permission prefix for per-player shop limits (materialshop.limit.<number>)
  materialshop.admin:
    default: op
    description: Use /shopadmin and manage admin shops
  materialshop.admin.bypass:
    default: op
    description: Bypass shop limits and all shop protections
