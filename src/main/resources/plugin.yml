name: MaterialShop
version: '${version}'
main: com.banglaverse.materialshop.MaterialShop
api-version: '1.21'
authors: [Ahmed332009]
description: Barter shop - trade materials for materials. No money, no Vault, no economy plugin.
commands:
  shop:
    aliases: [ms, materialshop]
    description: Open the MaterialShop market, manage listings and chest shops
    usage: /shop [collect|list|help|chest create]
  shopadmin:
    description: Create and manage server shops, reload configuration and view the trade log
    usage: /shopadmin [create|remove|edit|npc|list|reload|log]
permissions:
  materialshop.use:
    default: true
    description: Open /shop and trade with shops
  materialshop.create:
    default: true
    description: Create player shops with /shop create
  materialshop.collect:
    default: true
    description: Collect sale proceeds from the collect box
  materialshop.admin:
    default: op
    description: Use /shopadmin and manage admin shops
  materialshop.admin.bypass:
    default: op
    description: Bypass shop limits and all shop protections
