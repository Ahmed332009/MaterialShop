# =============================================================================
# MaterialShop 0.1.0 - marketplace configuration
# Materials pay for materials. No money, no Vault, no economy plugin.
# Reload without a restart: /shopadmin reload
# =============================================================================
config-version: 2

# Language file inside plugins/MaterialShop/. Every player-visible string lives there.
language-file: messages.yml

# ------------------------------------------------------------------------------
# LIMITS
# ------------------------------------------------------------------------------
# Default maximum chest shops per player. Raised by materialshop.limit.<number>.
shop-limit: 5
# Maximum market listings per player.
max-listings: 20
# Optional listing expiry in days. 0 = never expire.
listing-expiry-days: 0
# Hard cap for a single purchase (Max and Custom buttons).
max-quantity: 2304
# Collect box capacity, in item stacks per player.
collect-box-capacity: 45
# Chat prompt timeout in seconds (custom quantity, prices, names, stock).
prompt-timeout-seconds: 30

# ------------------------------------------------------------------------------
# PAYMENT RULES
# Air, non-items and spawn eggs are always blocked. Server shops ignore these lists.
# ------------------------------------------------------------------------------
payment-blacklist:
  - AIR
  - BEDROCK
  - BARRIER
  - COMMAND_BLOCK
  - CHAIN_COMMAND_BLOCK
  - REPEATING_COMMAND_BLOCK
  - COMMAND_BLOCK_MINECART
  - DEBUG_STICK
  - STRUCTURE_BLOCK
  - STRUCTURE_VOID
  - JIGSAW
  - END_PORTAL_FRAME
  - SPAWNER
payment-whitelist-enabled: false
payment-whitelist:
  - COPPER_INGOT
  - IRON_INGOT
  - GOLD_INGOT
  - DIAMOND
  - NETHERITE_INGOT

# ------------------------------------------------------------------------------
# VALUE TABLE (display only)
# Fairness warning threshold: a listing is lopsided when price/suggestion > ratio
# or < 1/ratio. It never blocks a listing or a trade. 0 disables the warning.
# Example commented entry: EMERALD: 12
# ------------------------------------------------------------------------------
material-values:
  COPPER_INGOT: 1
  COPPER_BLOCK: 9
  IRON_INGOT: 3
  IRON_BLOCK: 27
  GOLD_INGOT: 6
  GOLD_BLOCK: 54
  DIAMOND: 12
  DIAMOND_BLOCK: 108
  NETHERITE_INGOT: 96
  NETHERITE_BLOCK: 864
  # EMERALD: 12
fairness-ratio: 4.0

# ------------------------------------------------------------------------------
# CATEGORY MAPPING
# Each item gets the first category whose list contains its Material.
# Unlisted plain items fall back to Misc; named/custom-model items go to Custom items.
# ------------------------------------------------------------------------------
categories:
  Blocks:
    - STONE
    - COBBLESTONE
    - DIRT
    - GRASS_BLOCK
    - OAK_LOG
    - OAK_PLANKS
    - GLASS
  "Tools and Weapons":
    - DIAMOND_SWORD
    - DIAMOND_PICKAXE
    - IRON_SWORD
    - IRON_PICKAXE
    - BOW
    - ARROW
  Armor:
    - DIAMOND_HELMET
    - DIAMOND_CHESTPLATE
    - DIAMOND_LEGGINGS
    - DIAMOND_BOOTS
    - IRON_HELMET
    - IRON_CHESTPLATE
  Food:
    - BREAD
    - COOKED_BEEF
    - APPLE
    - GOLDEN_APPLE
    - CARROT
    - POTATO
  Redstone:
    - REDSTONE
    - REDSTONE_BLOCK
    - REPEATER
    - COMPARATOR
    - PISTON
    - OBSERVER
  Farming:
    - WHEAT
    - WHEAT_SEEDS
    - CARROT
    - POTATO
    - BONE_MEAL
    - SUGAR_CANE
  "Mob drops":
    - BONE
    - STRING
    - FEATHER
    - LEATHER
    - ROTTEN_FLESH
    - ENDER_PEARL
  "Ores and Ingots":
    - COAL
    - IRON_INGOT
    - COPPER_INGOT
    - GOLD_INGOT
    - DIAMOND
    - NETHERITE_INGOT
  Misc: []
  "Custom items": []

# ------------------------------------------------------------------------------
# CHEST SHOPS (optional)
# When false, every chest-shop button and command is hidden.
# ------------------------------------------------------------------------------
chest-shops:
  enabled: true

# ------------------------------------------------------------------------------
# TRANSACTION LOG
# Rotates by size into logs/transactions-<timestamp>.log.
# ------------------------------------------------------------------------------
logging:
  enabled: true
  rotate-megabytes: 5
  log-lines-in-gui: 12
