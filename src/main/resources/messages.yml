# MaterialShop player-facing text. Edit freely; no restart needed (/shopadmin reload).
# Format: MiniMessage tags (<gold>, <gray>, <red>, ...) and {placeholders}.
# Every menu title, button name and lore line below is read from this file.
# Player-supplied text is escaped, so a name cannot inject formatting.
prefix: "<dark_green>[Shop]</dark_green> "
word-server: "<gray>Server"
word-admin: "Admin"
word-player: "Player"
word-infinite: "infinite"
no-permission: "<red>You do not have permission to do that."
no-permission-admin: "<red>Admin permission (materialshop.admin) is required."
player-only: "<red>This command can only be used by a player."
unknown-command: "<red>Unknown subcommand. Use <white>{command} help</white>."
reloaded: "<green>MaterialShop configuration and messages reloaded."
help-header: "<gold>=== MaterialShop help ==="
help-1: "<white>/shop</white> <gray>Open the shop menu"
help-2: "<white>/shop create [name]</white> <gray>Place or look at a chest while holding the item to sell"
help-3: "<white>/shop list</white> <gray>List your shops"
help-4: "<white>/shop collect</white> <gray>Open your collect box"
help-5: "<white>/shop help</white> <gray>Show this help"
help-admin-1: "<white>/shopadmin create [name]</white> <gray>Create an admin shop (aliases /materialshop, /ms)"
help-admin-2: "<white>/shopadmin edit [id]</white> <gray>Edit an admin shop"
help-admin-3: "<white>/shopadmin remove [id]</white> <gray>Delete an admin shop"
help-admin-4: "<white>/shopadmin collect</white> <gray>Collect admin-shop earnings"
help-admin-5: "<white>/shopadmin log</white> <gray>Show the last trades"
help-admin-6: "<white>/shopadmin reload</white> <gray>Reload config and messages"

limit-reached: "<red>You already own {count} shops. Your limit is {limit}."
no-shops: "<gray>You do not own any shops yet. Hold the item to sell, look at a chest and use <white>/shop create</white>."
create-usage: "<gray>Hold the item you want to sell, look at a chest and use <white>/shop create [name]</white>."
create-no-item: "<red>Hold the item you want to sell in your main hand."
create-not-chest: "<gray>No chest in sight. Place a chest now to create your shop, or type <white>cancel</white>."
create-placement-hint: "<gray>Place a chest to finish creating <white>{name}</white>. Type <white>cancel</white> to stop."
create-cancelled: "<yellow>Shop creation cancelled."
create-timeout: "<yellow>Shop creation timed out. Nothing was created."
created: "<green>Shop <white>{name}</white> created. Set a payment in the menu."
chest-not-found: "<red>The shop chest is gone. The shop stays closed until it is restored."
chest-protected: "<red>This shop chest belongs to {owner}."
hoppers-blocked: "<red>Hoppers cannot move items from a shop chest."
shop-blocked-here: "<red>You cannot place a shop chest here (claim or region rules)."
not-your-shop: "<red>That shop is not yours."
shop-closed: "<yellow>Shop <white>{name}</white> closed. Stock and collect box were returned."
shop-reopened: "<green>Shop <white>{name}</white> is open again."
renamed: "<green>Shop renamed to <white>{name}</white>."
listing-added: "<green>Listing added: {item}."
listing-removed: "<yellow>Listing removed."
payment-added: "<green>Payment added: {item}."
payment-removed: "<yellow>Payment option removed."
payment-blacklisted: "<red>That item cannot be used as payment on this server."
payment-whitelist: "<red>That item is not on the payment whitelist."
payment-override-blocked: "<red>This shop does not allow that payment item."
too-many-options: "<red>A listing supports at most 4 payment options."
no-listings: "<red>This shop has no listings yet."
price-prompt: "<yellow>Type the number of {item} to ask as payment, or type cancel."
price-invalid: "<red>Enter a whole number between 1 and 64. Nothing changed."
name-prompt: "<yellow>Type the new shop name, or type cancel."
name-invalid: "<red>Names must be 1 to 32 characters. Nothing changed."
custom-prompt: "<yellow>Type how many to trade (max {max}), or type cancel."
custom-invalid: "<red>Enter a whole number between 1 and {max}. Nothing changed."
prompt-cancelled: "<yellow>Cancelled. Nothing changed."
prompt-cancel-hint: "<gray>Type <white>cancel</white> at any time to stop."
prompt-timeout: "<yellow>Input timed out. Nothing changed."

not-enough-stock: "<red>The shop does not have enough {item} in stock."
not-enough-payment: "<red>You do not have enough {item} to pay."
no-room: "<red>Your inventory cannot hold {item}. Nothing was taken."
collect-full: "<red>The seller's collect box is full, so this sale was refused. Nothing was taken."
self-trade: "<red>You cannot trade with your own shop."
admin-not-found: "<red>No admin shop with that id."
admin-collect-overflow: "<yellow>Collect-box space ran out; {item} was dropped at the shop."
admin-created: "<green>Admin shop <white>{name}</white> created with id <white>{id}</white>."
admin-removed: "<yellow>Admin shop <white>{name}</white> removed."
admin-limit: "<green>Admin shop limit bypass is now {value}."
trade-success: "<green>Bought <white>{item}</white> for <white>{payment}</white>."
trade-failed: "<red>Trade failed and everything was returned. Try again."
fairness-warning: "<yellow>Fairness hint: this price is about {ratio}x the suggested value ({suggested} {item}). The trade is still allowed."
collect-empty: "<gray>Your collect box is empty."
collected: "<green>Collected {count} stack(s)."
trade-log-empty: "<gray>No trades logged yet."
trade-log-line: "<gray>{time} <white>{buyer}</white> bought {item} from {seller} for {payment} at {location}"
villager-linked: "<green>Shop entity linked. Players can tap it to open this shop."
villager-missing: "<red>That shop has no live entity right now. Use /shop or /shopadmin edit."

